<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Ethio-Cosmos Learning Community</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Enhanced Service Worker Registration with Update Handling
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          sessionStorage.removeItem('sw-reloaded');
          navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((registration) => {
            console.log('[App] Service worker registered:', registration);

            const activateWaitingWorker = () => {
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
            };

            // Check for new builds immediately and periodically in the background.
            registration.update().catch((err) => {
              console.error('[App] Failed to check for SW updates:', err);
            });
            setInterval(() => {
              registration.update().catch((err) => {
                console.error('[App] Failed to check for SW updates:', err);
              });
            }, 60000);

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed') {
                  activateWaitingWorker();
                }
              });
            });
            activateWaitingWorker();

            // Reload once when the new worker takes control so the latest assets load.
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (sessionStorage.getItem('sw-reloaded') === '1') return;
              sessionStorage.setItem('sw-reloaded', '1');
              window.location.reload();
            });

            // Listen for messages from service worker
            navigator.serviceWorker.addEventListener('message', (event) => {
              const { type, message } = event.data;
              console.log('[App] Message from SW:', type, message);

              if (type === 'SW_INSTALLED') {
                console.log('[App] SW installed:', message);
              } else if (type === 'CACHE_UPDATED') {
                console.log('[App] Cache updated:', message);
              } else if (type === 'SYNC_COMPLETE') {
                console.log('[App] Sync complete:', message);
              }
            });
          }).catch((err) => {
            console.error('[App] Service worker registration failed:', err);
          });
        });
      }

      // Prevent multi-touch zoom while allowing single-touch scrolling
      document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });

      // Prevent double-tap zoom with better detection
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          // Only prevent if it's truly a double-tap (not a scroll)
          if (event.touches.length === 0) {
            event.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });

      // Prevent gesture zoom (Safari)
      document.addEventListener('gesturestart', function (event) {
        event.preventDefault();
      }, { passive: false });

      // Optimize touch performance with passive listeners for scroll events
      document.addEventListener('touchmove', function () {}, { passive: true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
